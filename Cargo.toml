[package]
name = "agent-session-router"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[lib]
name = "agent_session_router"
path = "src/lib.rs"

[[bin]]
name = "asr"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", features = ["http1", "json", "tokio", "ws"] }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
hyper-util = { version = "=0.1.20", features = ["server-auto", "tokio"] }
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive", "env", "string"] }
futures-util = { version = "0.3.31", features = ["sink"] }
flate2 = "1"
tar = "0.4"
getrandom = "=0.4.3"
percent-encoding = "2.3.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-segmentation = "1"
unicode-width = "0.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["macros", "server", "transport-async-rw", "transport-io"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache"] }
rustix = { version = "1.1", features = ["fs", "process", "thread"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
rustls-pemfile = "2.2"
schemars = { version = "1.1", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
subtle = "2"
tokio = { version = "=1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
url = "2.5"
uuid = { version = "1.20", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.24"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["client"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
